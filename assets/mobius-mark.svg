<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rotate-mobius {
        0% { transform: rotateY(0deg) rotateX(0deg); }
        50% { transform: rotateY(180deg) rotateX(0deg); }
        100% { transform: rotateY(360deg) rotateX(0deg); }
      }
      .mobius-path {
        animation: rotate-mobius 4s infinite linear;
        transform-origin: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .mobius-path {
          animation: none;
        }
      }
    </style>
  </defs>
  <path class="mobius-path" d="M20,50 Q50,20 80,50 Q50,80 20,50" stroke="#2FA6A0" stroke-width="8" fill="none" />
  <path class="mobius-path" d="M20,50 Q50,20 80,50 Q50,80 20,50" stroke="#C9A96E" stroke-width="4" fill="none" stroke-dasharray="10,5" />
</svg>
