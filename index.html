<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Möbius Muse Blueprint — Data Intake</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-brand">
        <object type="image/svg+xml" data="assets/mobius-mark.svg" class="mobius-mark" aria-label="Möbius Muse"></object>
        <h1 class="header-title">Möbius Muse Blueprint</h1>
      </div>
    </header>

    <main class="main-content">
      <nav class="stepper" aria-label="Form steps">
        <div class="stepper-item active" data-step="1">
          <span class="stepper-number">1</span>
          <span class="stepper-label">School & Policy</span>
        </div>
        <span class="stepper-connector"></span>
        <div class="stepper-item" data-step="2">
          <span class="stepper-number">2</span>
          <span class="stepper-label">Subjects</span>
        </div>
        <span class="stepper-connector"></span>
        <div class="stepper-item" data-step="3">
          <span class="stepper-number">3</span>
          <span class="stepper-label">Teachers</span>
        </div>
      </nav>

      <div id="step-1" class="step-container active">
        <!-- Step 1: School & Policy will be rendered here by step1-school-policy.js -->
      </div>

      <div id="step-2" class="step-container">
        <!-- Step 2: Subjects will be rendered here by step2-subjects.js -->
      </div>

      <div id="step-3" class="step-container">
        <!-- Step 3: Teachers will be rendered here by step3-teachers.js -->
      </div>

      <div id="step-review" class="step-container">
        <!-- Review screen will be rendered here by output.js -->
      </div>
    </main>

    <footer class="footer">
      <button id="prev-step" class="btn btn-secondary" disabled>Back</button>
      <button id="next-step" class="btn btn-primary" disabled>Continue</button>
    </footer>
  </div>

  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/schema.js"></script>
  <script type="module" src="js/step1-school-policy.js"></script>
  <script type="module" src="js/step2-subjects.js"></script>
  <script type="module" src="js/step3-teachers.js"></script>
  <script type="module" src="js/output.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
